# Local PostgreSQL for development and integration tests (001-authentication).
# Start with: docker compose up -d
# The init script creates both the dev and test databases.
services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm_auth
    ports:
      - '5432:5432'
    volumes:
      - crm_auth_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm_auth']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  crm_auth_pgdata:
